<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#682638">
  <title>김김김 | 모바일 명함</title>
  <style>
    :root {
      --burgundy: #682638;
      --ink: #382b2e;
      --muted: #78666b;
      --ivory: #faf7f2;
      --line: #ded1ce;
      --gold: #947443;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 18px;
      background: #ece5e1;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont,
        "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      word-break: keep-all;
    }
    .container { width: 100%; max-width: 460px; margin: auto; }
    .card {
      position: relative;
      padding: 36px 28px 28px;
      background: var(--ivory);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 20px 60px #382b2e12;
      overflow: hidden;
    }
    .business {
      min-height: calc(100svh - 48px);
      display: flex;
      flex-direction: column;
    }
    .business::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 7px;
      background: var(--burgundy);
    }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
    }
    .eyebrow {
      margin: 0;
      color: var(--burgundy);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
    }
    .seal {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      color: var(--burgundy);
      font-family: "Batang", serif;
      font-size: 22px;
    }
    h1 {
      margin: 0;
      color: var(--burgundy);
      font-family: "Nanum Myeongjo", "Batang", serif;
      font-size: clamp(44px, 12vw, 56px);
      line-height: 1.3;
      letter-spacing: 2px;
    }
    .role {
      margin: 14px 0 24px;
      color: var(--burgundy);
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 4px;
    }
    .intro { margin: 0; font-size: 21px; line-height: 1.8; }
    .accent { width: 40px; height: 2px; margin-top: 28px; background: var(--gold); }
    .work { margin: 34px 0 40px; }
    h2 { margin: 0 0 18px; font-size: 24px; font-weight: 600; }
    .work h2 { color: var(--muted); font-size: 20px; font-weight: 500; }
    ol { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
    li {
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 18px 2px;
      border-bottom: 1px solid var(--line);
      font-size: 26px;
    }
    .number { color: var(--gold); font: italic 18px Georgia, serif; }
    footer { margin-top: auto; }
    button {
      width: 100%;
      min-height: 64px;
      padding: 18px 22px;
      border: 0;
      border-radius: 3px;
      background: var(--burgundy);
      color: var(--ivory);
      font: inherit;
      font-size: 23px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:hover { background: #511c2b; }
    :is(button, input):focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
    #message, .hint { color: var(--muted); font-size: 17px; line-height: 1.6; }
    .calculator { margin-top: 24px; }
    .calculator h2 { color: var(--burgundy); }
    .hint { margin: 0 0 24px; }
    label { display: block; margin: 20px 0 10px; font-size: 20px; font-weight: 600; }
    .input-wrap { display: flex; align-items: center; gap: 12px; }
    input {
      width: 100%;
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 24px;
    }
    .unit { color: var(--muted); font-size: 20px; }
    .calculator button { margin-top: 26px; }
    .result {
      margin: 24px 0 0;
      padding: 22px 16px;
      background: #eee3e5;
      border-radius: 3px;
      text-align: center;
    }
    .result p { margin: 0; font-size: 18px; line-height: 1.6; }
    .result strong { display: block; margin: 8px 0; color: var(--burgundy); font-size: 34px; }
    .result small { display: block; color: var(--muted); font-size: 16px; line-height: 1.6; }
    [hidden] { display: none !important; }
    @media (max-width: 350px) {
      body { padding: 16px 12px; }
      .card { padding: 30px 20px 24px; }
      .intro { font-size: 19px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <article class="card business" aria-label="김김김 모바일 명함">
      <header>
        <div class="topline">
          <p class="eyebrow">PERSONAL CARD</p>
          <span class="seal" aria-hidden="true">김</span>
        </div>
        <h1>김김김</h1>
        <p class="role">직장인</p>
        <p class="intro">일상에 성실함을 더하고,<br>함께하는 일에 마음을 담습니다.</p>
        <div class="accent" aria-hidden="true"></div>
      </header>
      <section class="work" aria-labelledby="work-title">
        <h2 id="work-title">내가 하는 일</h2>
        <ol>
          <li><span class="number">01</span>랄랄랄</li>
          <li><span class="number">02</span>유후</li>
          <li><span class="number">03</span>아하</li>
          <li><span class="number">04</span>아하</li>
        </ol>
      </section>
      <footer>
        <button id="contact" type="button">문의하기 ↗</button>
        <p id="message" role="status" hidden></p>
      </footer>
    </article>
    <section class="card calculator" aria-labelledby="calculator-title">
      <h2 id="calculator-title">모임 회비 나누기</h2>
      <p class="hint">총 금액과 인원을 입력해 주세요.<br>1인당 금액은 1원 단위로 올림합니다.</p>
      <form id="split-form">
        <label for="total">총 금액</label>
        <div class="input-wrap">
          <input id="total" type="number" inputmode="numeric" min="0" max="1000000000000" step="1" placeholder="예: 100000" required>
          <span class="unit">원</span>
        </div>
        <label for="people">인원</label>
        <div class="input-wrap">
          <input id="people" type="number" inputmode="numeric" min="1" max="1000000" step="1" placeholder="예: 3" required>
          <span class="unit">명</span>
        </div>
        <button type="submit">1인당 금액 계산하기</button>
      </form>
      <div id="result" class="result" role="status" aria-live="polite" hidden></div>
    </section>
  </main>
  <script>
    const email = ""; // 문의받을 이메일 주소를 입력하세요.
    document.getElementById("contact").addEventListener("click", () => {
      if (email.trim()) {
        location.href = `mailto:${email.trim()}?subject=${encodeURIComponent("김김김님께 문의드립니다")}`;
      } else {
        const message = document.getElementById("message");
        message.textContent = "문의 연락처를 준비 중입니다.";
        message.hidden = false;
      }
    });
    const form = document.getElementById("split-form");
    const result = document.getElementById("result");
    form.addEventListener("input", () => { result.hidden = true; });
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      const total = Number(document.getElementById("total").value);
      const people = Number(document.getElementById("people").value);
      const amount = Math.ceil(total / people);
      const extra = amount * people - total;
      const format = (value) => value.toLocaleString("ko-KR");
      result.innerHTML = `<p>1인당 금액</p><strong>${format(amount)}원</strong><small>${format(people)}명 · 총 ${format(total)}원${extra ? `<br>올림으로 ${format(extra)}원이 더 모입니다.` : ""}</small>`;
      result.hidden = false;
    });
  </script>
</body>
</html>
