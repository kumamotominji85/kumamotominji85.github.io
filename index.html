<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#682638">
  <title>김민지 | 승무원</title>
  <style>
    :root {
      --burgundy: #682638;
      --ink: #382b2e;
      --muted: #78666b;
      --ivory: #faf7f2;
      --line: #ded1ce;
      --gold: #947443;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 18px;
      min-height: 100svh;
      background: #ece5e1;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont,
        "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      word-break: keep-all;
    }
    main {
      width: 100%;
      max-width: 460px;
      min-height: calc(100svh - 48px);
      margin: auto;
      padding: 42px 28px 28px;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--ivory);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 20px 60px #382b2e12;
      overflow: hidden;
    }
    main::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 7px;
      background: var(--burgundy);
    }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 44px;
    }
    .eyebrow {
      margin: 0;
      color: var(--burgundy);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
    }
    .monogram {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      color: var(--burgundy);
      font-family: Georgia, serif;
      font-size: 21px;
      font-style: italic;
    }
    h1 {
      margin: 0;
      color: var(--burgundy);
      font-family: "Nanum Myeongjo", "Batang", serif;
      font-size: clamp(44px, 12vw, 56px);
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: 2px;
    }
    .role {
      margin: 14px 0 26px;
      color: var(--burgundy);
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 4px;
    }
    .intro {
      margin: 0;
      font-size: 21px;
      line-height: 1.8;
      letter-spacing: -0.5px;
    }
    .accent {
      width: 40px;
      height: 2px;
      margin: 30px 0 0;
      background: var(--gold);
    }
    section { margin: 36px 0 40px; }
    h2 {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 1px;
    }
    ol {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--line);
    }
    li {
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 19px 2px;
      border-bottom: 1px solid var(--line);
      font-size: 26px;
      font-weight: 500;
    }
    .number {
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 18px;
      font-style: italic;
    }
    footer { margin-top: auto; }
    button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 66px;
      padding: 18px 24px;
      border: 1px solid var(--burgundy);
      border-radius: 3px;
      background: var(--burgundy);
      color: var(--ivory);
      font: inherit;
      font-size: 23px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      transition: background .2s;
    }
    button:hover { background: #511c2b; }
    button:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 4px;
    }
    #message {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
    }
    @media (max-width: 350px) {
      body { padding: 16px 12px; }
      main {
        padding: 32px 22px 24px;
        min-height: calc(100svh - 32px);
      }
      .intro { font-size: 19px; }
      .topline { margin-bottom: 32px; }
    }
  </style>
</head>
<body>
  <main aria-label="김민지 모바일 명함">
    <header>
      <div class="topline">
        <p class="eyebrow">PERSONAL CARD</p>
        <span class="monogram" aria-hidden="true">M</span>
      </div>
      <h1>김민지</h1>
      <p class="role">승무원</p>
      <p class="intro">
        세심한 배려와 따뜻한 미소로<br>
        편안한 여정을 함께합니다.
      </p>
      <div class="accent" aria-hidden="true"></div>
    </header>
    <section aria-labelledby="work-title">
      <h2 id="work-title">내가 하는 일</h2>
      <ol>
        <li><span class="number">01</span>랄랄랄</li>
        <li><span class="number">02</span>유후</li>
        <li><span class="number">03</span>아하</li>
        <li><span class="number">04</span>아하</li>
      </ol>
    </section>
    <footer>
      <button id="contact" type="button">
        문의하기 <span aria-hidden="true">↗</span>
      </button>
      <p id="message" role="status" hidden></p>
    </footer>
  </main>
  <script>
    // 문의받을 이메일 주소를 입력하세요.
    const email = "";
    document.getElementById("contact").addEventListener("click", () => {
      if (email.trim()) {
        const subject = encodeURIComponent("김민지님께 문의드립니다");
        window.location.href = `mailto:${email.trim()}?subject=${subject}`;
      } else {
        const message = document.getElementById("message");
        message.textContent = "문의 연락처를 준비 중입니다.";
        message.hidden = false;
      }
    });
  </script>
</body>
</html>
